<!-- NAVBAR (loaded from index.html via fetch) -->
<header class="relative w-full max-w-5xl mx-auto px-4 pt-4 sm:pt-6 z-40">
    <nav class="bg-white/80 backdrop-blur-md border-2 border-yellow-300 rounded-2xl px-4 sm:px-6 py-3 sm:py-4 shadow-md flex justify-between items-center">
        <a href="#" class="pixel-font text-xs sm:text-sm font-bold text-pink-600 flex items-center gap-2">
            <i class="fa-solid fa-star"></i> MA.DEV
        </a>

        <!-- Desktop / tablet menu -->
        <div class="hidden md:flex items-center gap-4 lg:gap-6 font-semibold text-sm text-gray-700">
            <a href="#about" class="hover:text-pink-600 transition">About</a>
            <a href="#education" class="hover:text-pink-600 transition">Education</a>
            <a href="#certificates" class="hover:text-pink-600 transition">Certificates</a>
            <a href="#portfolio" class="hover:text-pink-600 transition">Projects</a>
            <a href="#contact" class="hover:text-pink-600 transition">Contact</a>
        </div>
        <button onclick="toggleSkillsModal()" class="hidden md:block bg-pink-400 hover:bg-pink-500 text-white px-4 py-2 rounded-xl pixel-font text-[10px] shadow-sm transition">
            Skills
        </button>

        <!-- Mobile hamburger button -->
        <button id="menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu" aria-expanded="false" aria-controls="mobile-menu"
                class="md:hidden w-10 h-10 rounded-xl bg-pink-400 hover:bg-pink-500 text-white flex items-center justify-center shadow-sm transition">
            <i id="menu-icon" class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- Mobile dropdown menu -->
    <div id="mobile-menu" class="hidden md:hidden absolute left-4 right-4 top-full mt-2 bg-white/95 backdrop-blur-md border-2 border-yellow-300 rounded-2xl shadow-lg p-3 font-semibold text-gray-700">
        <a href="#about" onclick="toggleMobileMenu()" class="block px-4 py-3 rounded-xl hover:bg-pink-50 hover:text-pink-600 transition">About</a>
        <a href="#education" onclick="toggleMobileMenu()" class="block px-4 py-3 rounded-xl hover:bg-pink-50 hover:text-pink-600 transition">Education</a>
        <a href="#certificates" onclick="toggleMobileMenu()" class="block px-4 py-3 rounded-xl hover:bg-pink-50 hover:text-pink-600 transition">Certificates</a>
        <a href="#portfolio" onclick="toggleMobileMenu()" class="block px-4 py-3 rounded-xl hover:bg-pink-50 hover:text-pink-600 transition">Projects</a>
        <a href="#contact" onclick="toggleMobileMenu()" class="block px-4 py-3 rounded-xl hover:bg-pink-50 hover:text-pink-600 transition">Contact</a>
        <button onclick="toggleMobileMenu(); toggleSkillsModal()" class="mt-2 w-full bg-pink-400 hover:bg-pink-500 text-white py-3 rounded-xl pixel-font text-[10px] transition">Skills</button>
    </div>
</header>
