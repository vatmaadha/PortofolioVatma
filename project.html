<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio 2026 - Y2K Aesthetic</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #dbeafe;
            overflow-x: hidden;
        }
        .pixel-font {
            font-family: 'VT323', monospace;
        }
    </style>
</head>
<body class="selection:bg-pink-300">
    <!-- SECTION 2: HALAMAN BAWAH / DAFTAR PROJEK (Dimuat dari projects.js) -->
    <section id="projectsSection" class="min-h-screen w-full bg-[#fdf4ff] py-16 px-4 sm:px-8">
        <div class="max-w-5xl mx-auto">
            
            <!-- Section Header -->
            <div class="text-center mb-12">
                <div class="inline-block bg-yellow-300 border-3 border-black px-6 py-2 rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] -rotate-1 mb-3">
                    <h2 class="pixel-font text-3xl sm:text-4xl font-bold tracking-wider">🌟 MY COMPLETED PROJECTS 🌟</h2>
                </div>
                <p class="text-gray-600 text-sm sm:text-base">Kumpulan karya desain grafis, branding, dan aplikasi yang telah dikerjakan.</p>
            </div>

            <!-- Container Grid Proyek yang akan diisi otomatis oleh JavaScript -->
            <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Data akan dimasukkan lewat script di bawah -->
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-black text-white text-center py-6 text-xs pixel-font tracking-widest">
        <p>© 2026 KHAYLA OKTAVIONA RAMADHANI • Y2K PORTFOLIO</p>
    </footer>

    <!-- MEMANGGIL FILE projects.js & RENDER KE HTML -->
    <script src="projects.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const gridContainer = document.getElementById("projectsGrid");
            
            if (window.khaylaProjects && window.khaylaProjects.length > 0) {
                window.khaylaProjects.forEach(project => {
                    // Buat elemen card untuk setiap proyek
                    const card = document.createElement("div");
                    card.className = "bg-white border-3 border-black rounded-2xl overflow-hidden shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex flex-col justify-between hover:-translate-y-1 transition-transform";
                    
                    // Buat tag HTML untuk skills/tags
                    let tagsHtml = project.tags.map(tag => 
                        `<span class="bg-blue-100 border border-black text-xs px-2 py-0.5 rounded-md font-semibold">${tag}</span>`
                    ).join('');

                    card.innerHTML = `
                        <div>
                            <div class="h-48 overflow-hidden border-b-3 border-black relative">
                                <img src="${project.image}" alt="${project.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                                <span class="absolute top-2 right-2 bg-yellow-300 border-2 border-black text-xs px-2 py-1 font-bold rounded shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">${project.year}</span>
                            </div>
                            <div class="p-6">
                                <span class="text-xs uppercase tracking-wider text-pink-600 font-bold pixel-font text-base">${project.category}</span>
                                <h3 class="text-xl font-extrabold text-black mt-1 mb-2">${project.title}</h3>
                                <p class="text-gray-600 text-sm mb-4 leading-relaxed">${project.description}</p>
                            </div>
                        </div>
                        <div class="px-6 pb-6 pt-2 flex flex-wrap gap-1.5 border-t border-gray-100">
                            ${tagsHtml}
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });
            } else {
                gridContainer.innerHTML = `<p class="col-span-2 text-center text-gray-500">Belum ada data proyek ditemukan.</p>`;
            }
        });
    </script>
</body>
</html>
