<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Full Image</title>

  <style>
    *{
      margin: 0;
      padding: 0;
    }

    body{
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    img{
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #navbar{
      position: absolute;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 100;
    }
  </style>
</head>

<body>

  <div id="navbar"></div>

  <img src="home.png" alt="Full Image">

  <script>
    fetch("navbar.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      });
  </script>

</body>
</html>
